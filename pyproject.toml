[project]
name = "12angrymen"
version = "1.0.1"
description = 'Production files for "12 Angry Men"'
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cuelist",
    "qlab",
    "screenplay-tools>=0.0.10",
    "showrunner[all]>=0.1.0",
    "theatremix",
]

[tool.uv.sources]
theatremix = { path = "../TheatreMix-python", editable = true }
cuelist = { path = "../Cuelist-python", editable = true }
qlab = { path = "../QLab-python", editable = true }


[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "rich>=14.2.0",
    "uploadserver>=6.0.0",
]
