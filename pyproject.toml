[project]
name = "12angrymen"
version = "0.0.1"
description = 'Production files for "12 Angry Men"'
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "screenplay-tools>=0.0.10",
    "showrunner",
    "sqladmin>=0.24.0",
    "theatremix",
]

[tool.uv.sources]
screenplay_tools = { path = "../screenplay-tools/python", editable = true }
theatremix = { path = "../TheatreMix-python", editable = true }
showrunner = { path = "../ShowRunner", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "rich>=14.2.0",
    "uploadserver>=6.0.0",
]
